version: '3.8'

services:
  # Hospital Management System - Web Frontend UI
  hospital-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-management-frontend
    restart: always
    ports:
      - "8080:80"
    environment:
      - APP_NAME=Hospital Patient Management System
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - hospital-net

networks:
  hospital-net:
    driver: bridge
